name: Build and publish roadway images

on:
  schedule:
    # Weekly refresh after the usual Geofabrik/Photon data update window.
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      calver:
        description: 'Optional UTC release tag override (YYYY.MM.DD)'
        required: false
        type: string

concurrency:
  group: roadway-image-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  OSRM_PBF_URL: https://download.geofabrik.de/asia/philippines-latest.osm.pbf

jobs:
  release:
    name: Resolve CalVer
    runs-on: ubuntu-latest
    outputs:
      calver: ${{ steps.version.outputs.calver }}
    steps:
      - name: Resolve release tag
        id: version
        env:
          CALVER_OVERRIDE: ${{ inputs.calver }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${CALVER_OVERRIDE}" ]]; then
            if [[ ! "${CALVER_OVERRIDE}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              echo 'calver must match YYYY.MM.DD' >&2
              exit 1
            fi
            calver="${CALVER_OVERRIDE}"
          else
            calver="$(date -u +%Y.%m.%d)"
          fi

          echo "Publishing CalVer: ${calver}"
          echo "calver=${calver}" >> "${GITHUB_OUTPUT}"

  smoke:
    name: Validate OSRM profile variants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run OSRM profile smoke test
        run: bash osrm/tests/smoke.sh

  osrm-data:
    name: Download OSRM data
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download Philippines extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p osrm
          curl -fL --retry 5 --retry-delay 3 \
            "${OSRM_PBF_URL}" \
            -o osrm/philippines.osm.pbf

      - name: Upload OSRM data artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadway-osrm-data-${{ needs.release.outputs.calver }}
          path: osrm/philippines.osm.pbf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-osrm:
    name: Build osrm (${{ matrix.variant }})
    needs: [release, smoke, osrm-data]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: restrictive
            context: ./osrm
            dockerfile: ./osrm/Dockerfile
          - variant: permissive
            context: ./osrm
            dockerfile: ./osrm/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prepared OSRM data
        uses: actions/download-artifact@v4
        with:
          name: roadway-osrm-data-${{ needs.release.outputs.calver }}
          path: ./osrm

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: osrm
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/roadway-${SERVICE}" >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.calver }},enable=${{ matrix.variant == 'restrictive' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'restrictive' }}
            type=raw,value=${{ needs.release.outputs.calver }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}
          labels: |
            org.opencontainers.image.title=roadway-osrm
            org.opencontainers.image.version=${{ needs.release.outputs.calver }}
            org.opencontainers.image.variant=${{ matrix.variant }}
            org.opencontainers.image.description=Self-hosted osrm service image

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep the release value in the build inputs so each scheduled data
          # artifact invalidates the cached import layers.
          build-args: |
            OSRM_PROFILE=${{ matrix.variant }}
            OSRM_DATA_VERSION=${{ needs.release.outputs.calver }}
            PBF_FILE=philippines.osm.pbf
          cache-from: type=gha,scope=roadway-osrm-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=roadway-osrm-${{ matrix.variant }}

      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

  build-services:
    name: Build ${{ matrix.service }}
    needs: [release, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: photon
            variant: default
            context: ./photon
            dockerfile: ./photon/Dockerfile
          - service: ors-compat
            variant: default
            context: ./compat
            dockerfile: ./compat/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/roadway-${SERVICE}" >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.calver }},enable=${{ matrix.service != 'osrm' || matrix.variant == 'restrictive' }}
            type=raw,value=latest,enable=${{ matrix.service != 'osrm' || matrix.variant == 'restrictive' }}
            type=raw,value=${{ needs.release.outputs.calver }}-${{ matrix.variant }},enable=${{ matrix.service == 'osrm' }}
            type=raw,value=${{ matrix.variant }},enable=${{ matrix.service == 'osrm' }}
          labels: |
            org.opencontainers.image.title=roadway-${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.release.outputs.calver }}
            org.opencontainers.image.variant=${{ matrix.variant }}
            org.opencontainers.image.description=Self-hosted ${{ matrix.service }} service image

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'photon' && format('PHOTON_DATA_VERSION={0}', needs.release.outputs.calver) || '' }}
          cache-from: type=gha,scope=roadway-${{ matrix.service }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=roadway-${{ matrix.service }}-${{ matrix.variant }}

      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
