name: Build and publish roadway images

on:
  schedule:
    # Weekly refresh after the usual Geofabrik/Photon data update window.
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      calver:
        description: 'Optional UTC release tag override (YYYY.MM.DD)'
        required: false
        type: string

concurrency:
  group: roadway-image-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Resolve CalVer
    runs-on: ubuntu-latest
    outputs:
      calver: ${{ steps.version.outputs.calver }}
    steps:
      - name: Resolve release tag
        id: version
        env:
          CALVER_OVERRIDE: ${{ inputs.calver }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${CALVER_OVERRIDE}" ]]; then
            if [[ ! "${CALVER_OVERRIDE}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              echo 'calver must match YYYY.MM.DD' >&2
              exit 1
            fi
            calver="${CALVER_OVERRIDE}"
          else
            calver="$(date -u +%Y.%m.%d)"
          fi

          echo "Publishing CalVer: ${calver}"
          echo "calver=${calver}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.service }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: osrm
            context: ./osrm
            dockerfile: ./osrm/Dockerfile
          - service: photon
            context: ./photon
            dockerfile: ./photon/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/roadway-${SERVICE}" >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.calver }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=roadway-${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.release.outputs.calver }}
            org.opencontainers.image.description=Self-hosted ${{ matrix.service }} service image

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Changing this value invalidates the Photon import layer on each
          # scheduled release, even though its source URL is named `latest`.
          build-args: ${{ matrix.service == 'photon' && format('PHOTON_DATA_VERSION={0}', needs.release.outputs.calver) || '' }}
          cache-from: type=gha,scope=roadway-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=roadway-${{ matrix.service }}

      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
