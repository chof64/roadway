services:
  osrm:
    image: ghcr.io/chof64/roadway-osrm:${ROUTING_VARIANT:-restrictive}
    build:
      context: .
      dockerfile: osrm/Dockerfile
      args:
        OSRM_PROFILE: ${ROUTING_VARIANT:-restrictive}
        OSRM_DATA_VERSION: ${ROUTING_DATA_VERSION:-local}
    expose:
      - "80"
    restart: unless-stopped

  # Optional dual-profile deployment for an application facade such as Xicar.
  # Start with: docker compose --profile dual-routing up --build
  osrm-restrictive:
    profiles: [dual-routing]
    image: ghcr.io/chof64/roadway-osrm:restrictive
    build:
      context: .
      dockerfile: osrm/Dockerfile
      args:
        OSRM_PROFILE: restrictive
        OSRM_DATA_VERSION: ${ROUTING_DATA_VERSION:-local}
    expose:
      - "80"
    restart: unless-stopped

  osrm-permissive:
    profiles: [dual-routing]
    image: ghcr.io/chof64/roadway-osrm:permissive
    build:
      context: .
      dockerfile: osrm/Dockerfile
      args:
        OSRM_PROFILE: permissive
        OSRM_DATA_VERSION: ${ROUTING_DATA_VERSION:-local}
    expose:
      - "80"
    restart: unless-stopped

  ors-compat:
    image: ghcr.io/chof64/roadway-ors-compat:local
    build:
      context: ./compat
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":80"
      OSRM_UPSTREAM_URL: http://osrm:80
      CORS_ENABLED: "${CORS_ENABLED:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      CORS_ALLOWED_HEADERS: "${CORS_ALLOWED_HEADERS:-Content-Type, X-Request-ID}"
    expose:
      - "80"
    depends_on:
      osrm:
        condition: service_healthy
    restart: unless-stopped

  photon:
    image: ghcr.io/chof64/roadway-photon:local
    build:
      context: .
      dockerfile: photon/Dockerfile
    expose:
      - "80"
    restart: unless-stopped
